<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Job search</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --line:#e2e5ea; --muted:#6b7280; --accent:#2563eb; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
         background:var(--bg); color:#111827; }
  header { position:sticky; top:0; z-index:10; background:var(--card);
           border-bottom:1px solid var(--line); padding:10px 16px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .controls label { font-size:13px; color:var(--muted); display:flex; gap:5px; align-items:center; }
  select, input[type=number], input[type=text] { padding:6px 8px; border:1px solid var(--line);
           border-radius:6px; font-size:14px; background:#fff; }
  input[type=number] { width:64px; }
  input[type=text] { min-width:180px; }
  button { padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:#fff;
           cursor:pointer; font-size:14px; }
  button:hover { background:#f0f2f5; }
  #scrape { background:var(--accent); color:#fff; border-color:var(--accent); }
  #scrape:hover { background:#1d4ed8; }
  #stats { font-size:13px; color:var(--muted); margin-left:auto; }
  main { max-width:880px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:14px 16px; margin-bottom:12px; }
  .card h3 { margin:0 0 2px; font-size:16px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:8px; }
  .badges { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .badge { font-size:12px; padding:2px 8px; border-radius:999px; background:#eef1f5; color:#374151; }
  .badge.green { background:#dcfce7; color:#166534; }
  .badge.red { background:#fee2e2; color:#991b1b; }
  .badge.gray { background:#e5e7eb; color:#4b5563; }
  .actions { display:flex; gap:8px; }
  .actions .apply { background:var(--accent); color:#fff; border-color:var(--accent); }
  .actions .apply:hover { background:#1d4ed8; }
  #empty { color:var(--muted); text-align:center; padding:40px 0; }
</style>
</head>
<body>
<header>
  <div class="controls">
    <label>Status
      <select id="status">
        <option value="new">New</option>
        <option value="applied">Applied</option>
        <option value="dismissed">Dismissed</option>
        <option value="all">All</option>
      </select>
    </label>
    <label>&le;
      <input type="number" id="maxYears" value="4" min="0" max="20" /> yrs
    </label>
    <label>&le;
      <input type="number" id="maxApplicants" value="100" min="0" /> applicants
    </label>
    <label><input type="checkbox" id="hideNoSponsor" /> hide no-sponsor</label>
    <label><input type="text" id="q" placeholder="title or company" /></label>
    <button id="scrape">Scrape now</button>
    <span id="stats"></span>
    <span id="updated" style="font-size:12px;color:var(--muted)"></span>
  </div>
</header>
<main>
  <div id="jobs"></div>
  <div id="empty" style="display:none">No jobs match these filters.</div>
</main>

<script>
const statusSel = document.getElementById("status");
const maxYears = document.getElementById("maxYears");
const maxApplicants = document.getElementById("maxApplicants");
const hideNoSponsor = document.getElementById("hideNoSponsor");
const qBox = document.getElementById("q");
const scrapeBtn = document.getElementById("scrape");
const jobsDiv = document.getElementById("jobs");
const emptyDiv = document.getElementById("empty");
const statsSpan = document.getElementById("stats");
const updatedSpan = document.getElementById("updated");

// data refreshes on a fixed 30-minute cadence. between refreshes the list stays
// put (even across reloads, thanks to the cache) so working through it doesn't
// keep resurfacing newly-scraped jobs.
const REFRESH_MS = 30 * 60 * 1000;
const CACHE_KEY = "jobcache";

// in-memory snapshot of every stored job, plus when it was fetched
let state = { jobs: [], ts: 0 };

function saveCache() {
  // persisting is best-effort; a full/blocked localStorage isn't fatal
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify(state));
  } catch (e) {}
}

function loadCache() {
  try {
    const data = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (data && Array.isArray(data.jobs)) return data;
  } catch (e) {}
  return null;
}

// build the badge for sponsorship, color-coded
function sponsorBadge(value) {
  const b = document.createElement("span");
  b.className = "badge";
  if (value === "sponsors") { b.classList.add("green"); b.textContent = "sponsors"; }
  else if (value === "no_sponsorship") { b.classList.add("red"); b.textContent = "no sponsorship"; }
  else { b.classList.add("gray"); b.textContent = "sponsorship unknown"; }
  return b;
}

function badge(text, cls) {
  const b = document.createElement("span");
  b.className = cls ? "badge " + cls : "badge";
  b.textContent = text;
  return b;
}

// update a job's status in the cached snapshot and on the server, without
// refetching the list (so applying/dismissing never resurfaces new jobs)
async function setStatus(jobId, status) {
  for (let i = 0; i < state.jobs.length; i++) {
    if (state.jobs[i].job_id === jobId) {
      state.jobs[i].status = status;
      break;
    }
  }
  saveCache();
  render();
  await fetch("/api/jobs/" + encodeURIComponent(jobId) + "/status", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status: status }),
  });
}

// build one job card using textContent so all values are escaped by construction
function makeCard(job) {
  const card = document.createElement("div");
  card.className = "card";

  const h = document.createElement("h3");
  h.textContent = job.title || "(untitled)";
  card.appendChild(h);

  const sub = document.createElement("div");
  sub.className = "sub";
  const parts = [];
  if (job.company) parts.push(job.company);
  if (job.location) parts.push(job.location);
  sub.textContent = parts.join(" · ");
  card.appendChild(sub);

  const badges = document.createElement("div");
  badges.className = "badges";
  if (job.min_years === null || job.min_years === undefined) {
    badges.appendChild(badge("exp: unstated"));
  } else {
    badges.appendChild(badge(job.min_years + "+ yrs"));
  }
  // applicant count: green when low (early), gray when unknown
  if (job.applicants === null || job.applicants === undefined) {
    badges.appendChild(badge("applicants: ?", "gray"));
  } else {
    badges.appendChild(badge(job.applicants + " applicants", job.applicants < 25 ? "green" : ""));
  }
  badges.appendChild(sponsorBadge(job.sponsorship));
  if (job.job_level) badges.appendChild(badge(job.job_level));
  if (job.search_term) badges.appendChild(badge("via: " + job.search_term));
  card.appendChild(badges);

  const actions = document.createElement("div");
  actions.className = "actions";

  const apply = document.createElement("button");
  apply.className = "apply";
  apply.textContent = "Apply";
  apply.addEventListener("click", function () {
    if (job.url) window.open(job.url, "_blank", "noopener");
    setStatus(job.job_id, "applied");
  });
  actions.appendChild(apply);

  const dismiss = document.createElement("button");
  dismiss.textContent = "Dismiss";
  dismiss.addEventListener("click", function () { setStatus(job.job_id, "dismissed"); });
  actions.appendChild(dismiss);

  // non-new jobs can be put back to new
  if (job.status !== "new") {
    const reset = document.createElement("button");
    reset.textContent = "Reset";
    reset.addEventListener("click", function () { setStatus(job.job_id, "new"); });
    actions.appendChild(reset);
  }

  card.appendChild(actions);
  return card;
}

// pull the full job list from the server into the cache, then re-render. this
// is the only thing that brings in newly-scraped jobs, and it runs on the
// 30-minute timer (or when you hit "Scrape now").
async function fetchAll() {
  const res = await fetch("/api/jobs?status=all&max_years=100");
  const rows = await res.json();
  const jobs = [];
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    // keep only what the cards use; drop the heavy description
    jobs.push({
      job_id: r.job_id, title: r.title, company: r.company,
      location: r.location, url: r.url, min_years: r.min_years,
      sponsorship: r.sponsorship, applicants: r.applicants,
      job_level: r.job_level, search_term: r.search_term, status: r.status,
    });
  }
  state = { jobs: jobs, ts: Date.now() };
  saveCache();
  render();
}

// apply the header filters to the cached jobs, client-side (instant, no network)
function filtered() {
  const status = statusSel.value;
  const cap = parseInt(maxYears.value, 10);
  const maxY = isNaN(cap) ? 100 : cap;
  const acap = parseInt(maxApplicants.value, 10);
  const maxA = isNaN(acap) ? 1000000 : acap;
  const hide = hideNoSponsor.checked;
  const q = qBox.value.trim().toLowerCase();
  const out = [];
  for (let i = 0; i < state.jobs.length; i++) {
    const j = state.jobs[i];
    if (status !== "all" && j.status !== status) continue;
    if (j.min_years !== null && j.min_years !== undefined && j.min_years > maxY) continue;
    // unknown applicant count (null) always passes
    if (j.applicants !== null && j.applicants !== undefined && j.applicants > maxA) continue;
    if (hide && j.sponsorship === "no_sponsorship") continue;
    if (q) {
      const hay = ((j.title || "") + " " + (j.company || "")).toLowerCase();
      if (hay.indexOf(q) === -1) continue;
    }
    out.push(j);
  }
  return out;
}

function renderStats() {
  const counts = { new: 0, applied: 0, dismissed: 0 };
  for (let i = 0; i < state.jobs.length; i++) {
    const s = state.jobs[i].status;
    if (counts[s] === undefined) counts[s] = 0;
    counts[s] += 1;
  }
  statsSpan.textContent =
    "new " + counts.new + " · applied " + counts.applied + " · dismissed " + counts.dismissed;
  if (state.ts) {
    const d = new Date(state.ts);
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    updatedSpan.textContent = "updated " + hh + ":" + mm;
  }
}

function render() {
  const jobs = filtered();
  jobsDiv.innerHTML = "";
  for (let i = 0; i < jobs.length; i++) {
    jobsDiv.appendChild(makeCard(jobs[i]));
  }
  emptyDiv.style.display = jobs.length ? "none" : "block";
  renderStats();
}

// filters just re-render the cached jobs (no network), so the list only
// changes from your own actions, never from a background fetch
statusSel.addEventListener("change", render);
maxYears.addEventListener("input", render);
maxApplicants.addEventListener("input", render);
hideNoSponsor.addEventListener("change", render);
qBox.addEventListener("input", render);

scrapeBtn.addEventListener("click", async function () {
  scrapeBtn.disabled = true;
  scrapeBtn.textContent = "Scraping…";
  await fetch("/api/scrape", { method: "POST" });
  // the scrape runs in the background; give it a moment, then pull fresh data
  setTimeout(async function () {
    scrapeBtn.disabled = false;
    scrapeBtn.textContent = "Scrape now";
    await fetchAll();
  }, 6000);
});

// keep refreshing every 30 minutes while the tab is open
function startRefreshCycle() {
  setInterval(fetchAll, REFRESH_MS);
}

// on load: reuse the cached list if it's under 30 min old (so navigating away
// and back shows the same jobs); otherwise fetch fresh
const cached = loadCache();
const age = cached ? Date.now() - cached.ts : Infinity;
if (cached && age < REFRESH_MS) {
  state = cached;
  render();
  // refresh once the current snapshot turns 30 min old, then every 30 min
  setTimeout(function () {
    fetchAll();
    startRefreshCycle();
  }, REFRESH_MS - age);
} else {
  fetchAll();
  startRefreshCycle();
}
</script>
</body>
</html>
